tasks:
  - id: weekday-daily-attendees-0820
    enabled: true
    schedule: "20 8 * * 1-5"
    missed: skip
    kind: shell
    command: "./scripts/reconcile-daily-attendees.sh YYYY-MM-DD"

  - id: weekday-daily-attendees-1500
    enabled: true
    schedule: "0 15 * * 1-5"
    missed: skip
    kind: shell
    command: "./scripts/reconcile-daily-attendees.sh YYYY-MM-DD"

  - id: weekday-export-0800
    enabled: false
    schedule: "0 8 * * 1-5"
    missed: run-latest
    kind: shell
    command: "./scripts/export-sessions.sh YYYY-MM-DD"

  - id: weekday-export-1130
    enabled: false
    schedule: "30 11 * * 1-5"
    missed: run-latest
    kind: shell
    command: "./scripts/export-sessions.sh YYYY-MM-DD"

  - id: daily-analysis
    enabled: false
    schedule: "15 23 * * *"
    missed: run-latest
    kind: opencode
    instruction: |
      Read memory/history/YYYY-MM-DD.md (replace YYYY-MM-DD with today's date).
      If that file does not exist, skip the memory update entirely: do not write a
      summary, do not invent one, and do not append anything to MEMORY.md. Instead,
      append a line to logs/daily-analysis.log noting the skip (UTC timestamp, the
      missing date, and the reason "no history file").
      Extract key decisions, lessons learned, and user preferences.
      Append them as dated entries to MEMORY.md under the correct headings.
      Write a one-paragraph plain-English summary into the ## Summary section of today's history file.

  - id: weekly-review
    enabled: false
    schedule: "0 9 * * 1"
    missed: run-latest
    kind: opencode
    instruction: |
      Read the past 7 days of memory/history/ files (files named YYYY-MM-DD.md).
      Produce a short weekly summary covering key decisions, patterns, and lessons.
      Save the summary to memory/knowledge/weekly-YYYY-Www.md (replace YYYY-Www with the current ISO week).

  - id: obsidian-daily-note-review
    enabled: false
    schedule: "0 12 * * 1-5"
    missed: run-latest
    kind: opencode
    model: github-copilot/gpt-5.5
    thinking: medium
    instruction: |
      Work in my standard Obsidian vault:
      ~/OneDrive - BMW Group/01_Documents/_Obisidian_Notes_BMW

      Resolve "~" to the current user's home directory before file operations.

      Review the latest dated daily note in:
      00 📅 Daily Notes/
      Use the newest file matching YYYY-MM-DD.md. Ignore index notes and non-dated scratch notes.

      Also read these index notes:
      - 10 ⛩ AI Governance/__10 ⛩ AI Governance.md
      - 10 ⛩ AI Governance/_AI Gov Weekly.md
      - 20 🎯 Projekte/__20 🎯 Projekte.md

      Goals:

      1. Check whether content from the daily note belongs in AI Governance or Projekte.
         - If it clearly belongs in an existing note, amend that note.
         - If it clearly deserves a new durable note, create it in the correct folder.
         - If it is not clearly assignable, leave it in the daily note.
         - Before creating a new note, search for an existing suitable note.
         - When content is moved or promoted into another note, keep the daily note useful as a record of what happened that day by adding a link to the new or amended headline.
         - Prefer links to the exact relevant heading, for example [[Some Note#Relevant Heading|short description]].

      2. Fix typos and punctuation in the daily note.
         - Do not rewrite meaning or tone.
         - Do not change acronyms, product names, team names, or technical abbreviations.
         - Keep German/English mixed wording if that is how the note is written.

      3. Resolve people mentioned only by first name.
         - Search existing people notes under 60 🧔 People/80.00 Vault/.
         - If exactly one matching person note exists, replace the first-name reference with an Obsidian wikilink, using an alias when useful:
           [[@Full Name|First]]
         - If multiple people match, do not guess. Leave the text unchanged and add a short review note at the end of the daily note.
         - If no matching people note exists, do not create a person note automatically.

      Safety rules:
      - Do not edit Zoottelkeeper autogenerated index blocks.
      - Keep edits minimal and reviewable.
      - Use Obsidian wikilinks, not absolute file links.
      - Report the files changed and any unresolved ambiguities.
